services:
  controller:
    build:
      context: ..
      dockerfile: infra/service.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      AICRAFT_DB_PATH: /data/aicraft.sqlite
      AICRAFT_SECRET_DB_PATH: /data/aicraft-secrets.sqlite
      AICRAFT_SECRET_KEY_PATH: /data/aicraft-secret.key
    volumes:
      - controller-state:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  panel:
    build:
      context: ..
      dockerfile: infra/panel.Dockerfile
    depends_on:
      controller:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  controller-state:
